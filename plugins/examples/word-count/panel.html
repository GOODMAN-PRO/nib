<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Word Count</title>
<style>
:root { color-scheme: light dark; font: -apple-system-body; }
body { margin: 24px; color: CanvasText; background: Canvas; }
h1 { font-size: 1em; font-weight: 600; margin: 0 0 24px; }
output { display: block; font-size: 3em; font-weight: 600; font-variant-numeric: tabular-nums; }
p { margin: 8px 0; }
#context { opacity: .7; }
@media (max-width: 240px) { body { margin: 16px; } }
</style>
</head>
<body>
<h1>Word Count</h1>
<div role="status" aria-live="polite" aria-atomic="true">
<output id="words" aria-label="Word count">0</output>
<p>words</p><p id="context">Open a page to count its words.</p>
</div>
<script>
nib.onMessage(m => {
  const context = document.getElementById("context");
  if (m.error) { context.textContent = m.error; return; }
  document.getElementById("words").textContent = String(m.words || 0);
  context.textContent = m.pageNumber ? "Page " + m.pageNumber : (m.page ? "Current page" : "Open a page to count its words.");
});
nib.postMessage({type: "refresh"});
window.addEventListener("pagehide", () => nib.postMessage({type: "closed"}));
document.addEventListener("visibilitychange", () => {
  nib.postMessage({type: document.hidden ? "closed" : "refresh"});
});
</script>
</body>
</html>
